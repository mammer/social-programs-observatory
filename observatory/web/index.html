<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Programmes Observatory</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <p class="eyebrow" data-i18n="subtitle"></p>
      <h1 data-i18n="app_title"></h1>
      <label for="u" data-i18n="username"></label>
      <input id="u" name="username" autocomplete="username" required>
      <label for="p" data-i18n="password"></label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden data-i18n="login_error"></p>
      <button type="submit" class="primary" data-i18n="sign_in"></button>
      <div class="langs" role="group" aria-label="Language"></div>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div><strong data-i18n="app_title"></strong><small data-i18n="subtitle"></small></div>
      </div>
      <nav id="nav" class="nav" aria-label="Navigation"></nav>
      <div class="tools">
        <div class="langs" role="group" aria-label="Language"></div>
        <span id="who" class="who"></span>
        <button id="logout" class="ghost" data-i18n="sign_out"></button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <footer class="foot"><span data-i18n="footer"></span></footer>
  </div>
  <script src="/static/i18n.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
